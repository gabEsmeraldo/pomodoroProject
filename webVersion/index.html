<link rel="stylesheet" href="templates/bootstrap.css">
<link rel="stylesheet" href="templates/styles.css">


<!-- trocar icone da aba -->
<link rel="icon" href="assets/image-removebg-preview.png">
<!-- escolher um nome descente -->
<title>Pomodoro</title> 

<button class="settings-button" id="settingsButton" type="button" aria-label="Open settings" title="Settings">
    &#9881;
</button>

<div class="settings-modal" id="settingsModal" aria-hidden="true">
    <div class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-header">
            <h2 id="settingsTitle">Settings</h2>
            <button class="settings-close" id="settingsCloseButton" type="button" aria-label="Close settings">&times;</button>
        </div>
        <div class="settings-content">
            <label class="settings-field" for="wallpaperInput">
                <span>Wallpaper</span>
                <input id="wallpaperInput" type="file" accept="image/*">
            </label>
            <button class="settings-secondary" id="resetWallpaperButton" type="button">Reset wallpaper</button>

            <label class="settings-field" for="soundInput">
                <span>Notification sound</span>
                <input id="soundInput" type="file" accept="audio/*">
            </label>
            <div class="settings-actions">
                <button class="settings-secondary" id="testSoundButton" type="button">Test sound</button>
                <button class="settings-secondary" id="resetSoundButton" type="button">Reset sound</button>
            </div>
        </div>
    </div>
</div>


<div class="selector" id="selector">
    <div class="buttonMode">
        <button id="modePomodoro" type="button" onclick="changeToPomodoro()">Pomodoro</button>
        <button id="modeBreak" type="button" onclick="changeToBreak()">Break</button>
    </div>
    <div class="timer" id="timerPomodoro">
        <form>
            <input id="pomodoroHoursSelector" type="number" placeholder="00" min="0" max="23" value="">
            <a class="dots">:</a>
            <input id="pomodoroMinutesSelector" type="number" placeholder="00" min="0" max="59" value="">
            <a class="dots">:</a>
            <input id="pomodoroSecondsSelector" type="number" placeholder="00" min="0" max="59" value="">
        </form>
    </div>
    <div class="timer" id="timerBreak" style="display: none;">
        <form>
            <input id="breakMinutesSelector" type="number" placeholder="00" min="0" max="59" value="">
            <a class="dots">:</a>
            <input id="breakSecondsSelector" type="number" placeholder="00" min="0" max="59" value="">
        </form>
    </div>
    <button class="buttonStart" id="startButton">Start</button>
</div>
<div class="fullScreenTimer" id="fullScreenTimer" style="display: none;">
    <div class="timerDisplay">
        <h1 id="timerDisplay">00:00:00</h1>
    </div>
    <div class="buttonFullScreen">
        <button id="resetButton" type="button">Reset</button>
        <button id="pauseButton" type="button">Pause</button>
        <button id="unpauseButton" type="button">Unpause</button>
        <button id="skipButton" type="button">Skip</button>
        <button id="breakButton" type="button">Break</button>
        <button id="stopButton" type="button">Stop</button>
    </div>    
</div>
<script src="js/timer.js"></script>
<script src="js/changePageScripts.js"></script>
